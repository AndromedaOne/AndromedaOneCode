sensors {
   
}

pigeon {
    id=2
    canBus = "DriveTrainRAWR"
}

photonvision {
    useVisionForPose = true
    useAndyMarkField = false
    numberOfCameras = 2
    cameraName1 = OV9281-1mp-120fps-13
    cameraName2 = OV9281-1mp-120fps-14
   # 13 is the starboard camera
    OV9281-1mp-120fps-13 {
        cameraOffsetToCenterInInches = -9.5615
        cameraOffsetToCenterInInchesY = -13.28
        cameraHeightInInches = 19.125
        cameraRollInDegrees = 0
        cameraPitchInDegrees = 0
        cameraYawInDegrees = 270
    }
    # 14 is the port camera
    OV9281-1mp-120fps-14 {
        cameraOffsetToCenterInInches = -9.55
        cameraOffsetToCenterInInchesY = 13.33
        cameraHeightInInches = 19.0625
        cameraRollInDegrees = 0
        cameraPitchInDegrees = 0
        cameraYawInDegrees = 90
    }
}